name: Nue
options:
  bundleIdPrefix: com.enludus
  deploymentTarget:
    iOS: "17.0"
packages:
  NueKit:
    path: NueKit
targets:
  Nue:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - NueApp
      # Same sound effects / icons / BGM as the Rust renderer (folder references).
      - path: ../data/se
        type: folder
        buildPhase: resources
      - path: ../data/icons
        type: folder
        buildPhase: resources
      - path: ../data/bgm
        type: folder
        buildPhase: resources
    dependencies:
      - package: NueKit
    info:
      path: NueApp/Info.plist
      properties:
        CFBundleDisplayName: Nue
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSpeechRecognitionUsageDescription: 字幕を作るために、動画の音声を端末内で文字起こしします。
        NSPhotoLibraryAddUsageDescription: 書き出した動画を写真ライブラリに保存します。
        NSPhotoLibraryUsageDescription: 編集する動画を選びます。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.nue
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
