[package]
name = "muscle"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
notify = "6.1"
anyhow = "1.0"
reqwest = { version = "0.13.2", features = ["blocking", "json", "rustls"] }
base64 = "0.22.1"
