services:
  # Rust worker: watches data/raw, analyzes (local or Gemini), renders with FFmpeg.
  muscle:
    build:
      context: ./muscle
      args:
        # tiny | base | small (default) | medium | none (skip on-device subtitles)
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    command: ["muscle", "worker"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - NUE_ANALYZER=${NUE_ANALYZER:-auto}
      - NUE_LANGUAGE=${NUE_LANGUAGE:-auto}
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "2.0"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js: upload UI, job status and output delivery (API routes).
  web:
    build: ./web
    user: "0:0"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NUE_DATA_DIR=/app/data
    restart: always
